
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Visiting Components</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="./css/bootstrap.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>

  <div class="container">

    <div class="card bg-light border-0 shadow-lg rounded-4 mt-5">
      <div class="card-body">

        <!-- Top Row -->
        <div class="row p-3 p-md-5 g-3">

          <div class="col-md-7">
            <h2 class="h2 fw-bold">
              What others think about the product
            </h2>
          </div>

          <div class="col-md-5">
            <div class="card">
              <div class="card-body text-center">

                <h3 class="display-5 fw-semibold">
                  <i class="fas fa-star text-warning"></i>
                  4.8
                </h3>

                <p class="text-center mb-0">
                  Average Rating
                </p>

              </div>
            </div>
          </div>

        </div>

        <!-- Search -->
        <div class="row px-3 px-md-5">
          <div class="col-12">

            <div class="input-group input-group-lg">

              <span class="input-group-text rounded-start-5">
                <i class="fas fa-search"></i>
              </span>

              <input
                type="text"
                class="form-control rounded-end-5"
                placeholder="Search Reviews"
                aria-label="Search Reviews"
              />

            </div>
          </div>
        </div>

        <!-- Rating -->
        <div class="row p-3 p-md-5">
          <div class="col-12 vstack gap-2">

            <h5>Reviews</h5>

            <!-- 5 Stars -->
            <div class="d-flex align-items-center gap-1">
              <span>5</span>
              <i class="fas fa-star text-warning"></i>

              <div class="progress ms-3 flex-grow-1" style="height: 10px;">
                <div
                  class="progress-bar bg-warning"
                  style="width: 80%;"
                  role="progressbar"
                  aria-label="5 star reviews"
                  aria-valuenow="80"
                  aria-valuemin="0"
                  aria-valuemax="100">
                </div>
              </div>
            </div>

            <!-- 4 Stars -->
            <div class="d-flex align-items-center gap-1">
              <span>4</span>
              <i class="fas fa-star text-warning"></i>

              <div class="progress ms-3 flex-grow-1" style="height: 10px;">
                <div
                  class="progress-bar bg-warning"
                  style="width: 60%;"
                  role="progressbar"
                  aria-label="4 star reviews"
                  aria-valuenow="60"
                  aria-valuemin="0"
                  aria-valuemax="100">
                </div>
              </div>
            </div>

            <!-- 3 Stars -->
            <div class="d-flex align-items-center gap-1">
              <span>3</span>
              <i class="fas fa-star text-warning"></i>

              <div class="progress ms-3 flex-grow-1" style="height: 10px;">
                <div
                  class="progress-bar bg-warning"
                  style="width: 20%;"
                  role="progressbar"
                  aria-label="3 star reviews"
                  aria-valuenow="20"
                  aria-valuemin="0"
                  aria-valuemax="100">
                </div>
              </div>
            </div>

            <!-- 2 Stars -->
            <div class="d-flex align-items-center gap-1">
              <span>2</span>
              <i class="fas fa-star text-warning"></i>

              <div class="progress ms-3 flex-grow-1" style="height: 10px;">
                <div
                  class="progress-bar bg-warning"
                  style="width: 10%;"
                  role="progressbar"
                  aria-label="2 star reviews"
                  aria-valuenow="10"
                  aria-valuemin="0"
                  aria-valuemax="100">
                </div>
              </div>
            </div>

            <!-- 1 Star -->
            <div class="d-flex align-items-center gap-1">
              <span>1</span>
              <i class="fas fa-star text-warning"></i>

              <div class="progress ms-3 flex-grow-1" style="height: 10px;">
                <div
                  class="progress-bar bg-warning"
                  style="width: 30%;"
                  role="progressbar"
                  aria-label="1 star reviews"
                  aria-valuenow="30"
                  aria-valuemin="0"
                  aria-valuemax="100">
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- Button -->
        <div class="row px-3 px-md-5 pb-4">
          <div class="col-12">

            <a href="#" class="btn btn-success btn-lg rounded-5">
              Write Review
            </a>

          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Bootstrap JavaScript -->
  <script src="./js/bootstrap.bundle.min.js"></script>

</body>
</html>
